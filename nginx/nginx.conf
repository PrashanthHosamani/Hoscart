upstream django {
    # This tells Nginx where our Django/Gunicorn app is running
    # "web" is the service name we'll define in docker-compose.yml
    server web:8000;
}

server {
    # Nginx listens on port 80 (standard HTTP port)
    listen 80;

    # Serve static files directly (CSS, JS, images for Django admin)
    # Django doesn't need to handle these — Nginx is much faster at it
    location /static/ {
        alias /app/staticfiles/;
    }

    # Serve user-uploaded media files directly
    location /media/ {
        alias /app/media/;
    }

    # For all other requests (API calls), forward to Django/Gunicorn
    location / {
        proxy_pass http://django;

        # Pass important headers so Django knows the real client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
