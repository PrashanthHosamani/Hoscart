services:

  # ============================================================
  # Service 1: PostgreSQL Database
  # This is our database container. Django will connect to it.
  # ============================================================
  db:
    image: postgres:16-alpine          # Official PostgreSQL image (alpine = smaller size)
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist data even if container restarts
    env_file:
      - .env.docker                    # Load DB credentials from our env file
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:                       # Wait until Postgres is truly ready before starting Django
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Service 2: Django Application (Gunicorn)
  # This is our actual Django backend.
  # ============================================================
  web:
    build: .                           # Build using our Dockerfile in the current directory
    volumes:
      - static_volume:/app/staticfiles # Share static files with Nginx
      - media_volume:/app/media        # Share media files with Nginx
    env_file:
      - .env.docker                    # Inject all env variables into the container
    depends_on:
      db:
        condition: service_healthy     # Only start after PostgreSQL is healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn hoscart.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # ============================================================
  # Service 3: Nginx (Reverse Proxy)
  # The front door of our server. Receives all internet traffic
  # and routes it to Django or serves static/media files directly.
  # ============================================================
  nginx:
    image: nginx:alpine                # Official Nginx image
    ports:
      - "80:80"                        # Map port 80 on the HOST to port 80 in the container
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf  # Our custom Nginx config
      - static_volume:/app/staticfiles  # Serve static files directly
      - media_volume:/app/media         # Serve media files directly
    depends_on:
      - web                            # Only start after Django is up

# ============================================================
# Named Volumes — these persist data outside the containers
# Without this, ALL your database data would be lost on restart
# ============================================================
volumes:
  postgres_data:
  static_volume:
  media_volume:
